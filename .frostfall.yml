version: 1

# Frostfall accessibility config.
#
# Repeatable local scan (seeded data, matches the committed baseline):
#   make frostfall-local
#
# Quick look at whatever dev stack is already running (counts drift with data):
#   make dev-up && make frontend-env   (in ../ztmf)
#   yarn dev                           (here)
#   make frostfall-report

server:
  baseUrl: http://localhost:5174

defaults:
  standard: section508

baseline: .frostfall-baseline.json

# NOTE: this app uses a hash router - routes live in the fragment (/#/users),
# so plain paths like /users would all render the dashboard.
tests:
  - id: dashboard
    path: /
    waitFor: '.MuiDataGrid-root'

  - id: users
    path: '/#/users'
    rules:
      # The users grid is the one grid tall enough to scroll whose action
      # buttons all sit at tabindex="-1" (MUI's roving focus for a
      # `type: 'actions'` column). axe only looks for a tab stop INSIDE the
      # scroll container, so it reads that as unreachable - but the grid's tab
      # stop is the column header, and ArrowDown from there walks into the rows
      # and scrolls them (the WAI-ARIA grid pattern). Off here only; every other
      # page keeps the rule, and the dashboard grid still has to pass it.
      #
      # Rules scope to a test, not a selector, so this covers the whole /#/users
      # route: a scrollable region added to this page later would go unchecked.
      # Re-point it at the grid if frostfall grows selector-scoped rules.
      scrollable-region-focusable: off

  - id: admin-opdivs
    path: '/#/admin/opdivs'

  # Events is gated on unscoped read, which the seeded Test.User (OWNER) has.
  # The grid paginates server-side and renders no toolbar, so unlike the others
  # it has no quick-search box - the waitFor is the grid itself.
  - id: admin-events
    path: '/#/admin/events'
    waitFor: '.MuiDataGrid-root'

  # The questionnaire, the app's one long editable form. DS-1 is the Death Star
  # in the Empire seed, which has answers for the open call. Wait for a native
  # answer radio, which only renders after the current question's choices have
  # loaded; PageHeader's h1 renders earlier while that payload is still pending.
  - id: questionnaire
    path: '/#/questionnaire/DS-1'
    waitFor: 'input[name="radio-choices"]'

  # System detail page incl. the ZTMF Insights enrichment cards.
  # 1002 = the Executor in the Empire seed: active, sdl_sync_enabled, and has
  # an enrichment row WITHOUT a contacts key, so this scans the legacy-fallback
  # Contacts rendering. The waitFor anchor only renders once the enrichment
  # payload has loaded. Note for dev-attach runs (make frostfall): this id only
  # exists in the seeded stack, so the test times out against dev data - use
  # 'make frostfall-local' for the full set.
  - id: system-detail
    path: '/#/systems/1002'
    waitFor: '#enrichment-synced-at'

  # The answer-history drawer (ztmf-misc#392), the app's first hand-rolled
  # Drawer - the theme's MuiDrawer override had never been exercised before it.
  #
  # SSD-EX (1002) rather than DS-1: the seed's answer-history fixture lives on
  # 1002, on the question its questionnaire lands on, so the trigger is present
  # without navigating. See the fixture comment in _test_data_empire.sql for
  # why it is not on DS-1.
  - id: answer-history-drawer
    # Deep-linked rather than landing on the questionnaire's first question.
    # ztmf-misc#393 makes which question loads first deterministic, but it has
    # not merged yet; once it has, this can become the plain questionnaire path.
    path: '/#/questionnaire/system/1002/Audit_Fields_Smoke_Cycle/identity/imperial-identity-verification'
    scan: false
    steps:
      # The link sits beside the save indicator in the question card, so its
      # presence already proves the questionnaire payload and audit fields
      # loaded. It is a real focusable control, not tooltip content.
      - waitFor: '#view-answer-history'
      - click: '#view-answer-history'
      # Only mounts once the drawer is open AND the revisions read resolved.
      - waitFor: '#answer-history-title'
      # Scanning mid-transition measures text blended with the backdrop and
      # reads as a contrast failure that vanishes on the next run. MUI's slide
      # transition is comparable to the Dialog fade the pillar-scores modal
      # used to need this for.
      - wait: 400ms
      - scan:
          label: drawer-open
          # MUI puts role="presentation" on the Drawer root, not role="dialog",
          # so this scopes by id rather than by role.
          scope: '#answer-history-panel'

  # Dedicated redesigned page (the old pillar-scores modal no longer exists).
  # The radar's labelled image mounts only after the seeded score payload has
  # loaded, so the scan covers the populated page rather than its spinner.
  - id: pillar-scores
    path: '/#/systems/1002/pillar-scores'
    waitFor: '[role="img"][aria-label^="Radar chart"]'

profiles:
  # CI attaches to a running vite server just like local runs do - the app
  # needs the vite /api proxy, so a static dist serve would 404 every API call.
  ci:
    defaults:
      # The baseline burned down to zero in ui#714, so there is no debt left to
      # grandfather: any new serious-or-worse violation fails the scan.
      expect:
        severity: serious
