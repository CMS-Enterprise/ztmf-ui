name: UI

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: environment to deploy to
        required: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: DEBUG - node, npm, yarn versions
        run: |
          echo "node --version: $(node --version)"
          echo "npm --version: $(npm --version)"
          echo "yarn --version: $(yarn --version)"

      - name: CACHE - get yarn cache folder path
        id: yarn-cache-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: CACHE - yarn dependencies
        id: yarn-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock', '.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: INSTALL - dependencies
        run: yarn install --immutable

      - name: LINT
        run: yarn lint

      - name: TEST
        run: yarn test:ci

      - name: BUILD
        # VITE_* vars are baked into the bundle at build time, so they must
        # be set on the build step itself, not on the deployed container.
        # Default off; flip per environment as IdP rollout progresses.
        # Prod joins dev now that its backend has dual-IdP enabled. Impl stays
        # off until its own backend flag is, or its lookup call would fall
        # through to the OIDC-gated /api/* rule and break sign-in.
        env:
          VITE_IDP_ENABLED: ${{ (inputs.environment == 'dev' || inputs.environment == 'prod') && 'true' || 'false' }}
          # Insights "How to fix" remediation — trialed in impl only; off in dev/prod.
          VITE_INSIGHTS_SUGGEST_FIX_ENABLED: ${{ inputs.environment == 'impl' && 'true' || 'false' }}
          # Dev-only banner overrides. Sourced from secrets so the feedback form
          # URL and contact address stay out of the repo. Clear these secrets
          # when the testing window ends and the banner reverts to default copy.
          VITE_DEV_BANNER_MESSAGE: ${{ inputs.environment == 'dev' && secrets.DEV_BANNER_MESSAGE || '' }}
          VITE_DEV_FEEDBACK_URL: ${{ inputs.environment == 'dev' && secrets.DEV_FEEDBACK_URL || '' }}
          VITE_DEV_CONTACT_EMAIL: ${{ inputs.environment == 'dev' && secrets.DEV_CONTACT_EMAIL || '' }}
        run: yarn build:${{ inputs.environment }}

      - name: Get AWS Creds
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.ROLEARN }}
          role-duration-seconds: 900
          aws-region: us-east-1

      - name: Write empty runtime config
        # public/config.js is gitignored (it carries the local auth-bypass
        # token), so the build emits no config.js. Ship an empty stub so the
        # index.html script tag resolves instead of 404ing on every load.
        run: echo 'window.ZTMF_RUNTIME_CONFIG = {}' > ./dist/config.js

      - name: AWS Sync
        run: aws s3 sync ./dist s3://${{ secrets.BUCKET_NAME }}/ --delete

      - name: Invalidate CloudFront Cache
        run: |
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          else
            echo "::notice::CLOUDFRONT_DISTRIBUTION_ID secret not set. Skipping cache invalidation."
          fi
