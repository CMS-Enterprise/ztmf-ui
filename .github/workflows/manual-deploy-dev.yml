name: Manual Deploy to DEV

# Deploy main to DEV on demand.
#   - orchestration-dev (open/sync a PR): preview a feature branch on DEV.
#   - this workflow: (re)deploy main to DEV, e.g. to reset DEV after branch deploys.
# Run: gh workflow run "Manual Deploy to DEV" --ref main
on:
  workflow_dispatch:

# Serialize runs on the same ref; never cancel a run that may be mid-deploy.
concurrency:
  group: manual-deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Analysis
    uses: ./.github/workflows/analysis.yml
    secrets: inherit

  ui:
    # Shares the dev sync queue with orchestration-dev.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    name: ui
    needs:
      - analysis
    uses: ./.github/workflows/ui.yml
    with:
      environment: dev
    secrets: inherit
