name: Manual Deploy to IMPL

# Deploy a chosen branch to the IMPL environment on demand.
#   - Run it against any branch to preview that ref on the shared impl env:
#       gh workflow run "Manual Deploy to IMPL" --ref <branch>
#   - The deploy AT merge is automatic (orchestration-impl, push to impl). This
#     workflow is the optional pre-merge preview against the shared impl env.
on:
  workflow_dispatch:

# Serialize runs on the same ref; never cancel a run that may be mid-deploy.
concurrency:
  group: manual-deploy-impl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Analysis
    uses: ./.github/workflows/analysis.yml
    secrets: inherit

  ui:
    # Shares the impl sync queue with orchestration-impl.
    concurrency:
      group: deploy-impl
      queue: max
      cancel-in-progress: false
    name: ui
    needs:
      - analysis
    uses: ./.github/workflows/ui.yml
    with:
      environment: impl
    secrets: inherit
