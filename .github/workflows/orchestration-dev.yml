name: Orchestration DEV

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# Serialize runs on the same ref; never cancel a run that may be mid-deploy.
concurrency:
  group: orchestration-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Analysis
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/analysis.yml
    secrets: inherit

  ui:
    # One dev sync at a time across all PRs. queue: max keeps every waiter
    # (default single evicts the pending one, leaving that PR with no dev
    # deployment and therefore unmergeable); never cancel a sync mid-flight.
    concurrency:
      group: deploy-dev
      queue: max
      cancel-in-progress: false
    name: ui
    if: github.event.pull_request.draft == false
    needs:
      - analysis
    uses: ./.github/workflows/ui.yml
    with:
      environment: dev
    secrets: inherit
  