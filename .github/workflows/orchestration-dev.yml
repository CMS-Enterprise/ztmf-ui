name: PR checks

# Tests every PR to main without deploying it. PR previews run in per-PR
# environments (orchestration-pr.yml); dev deploys only from merges to main,
# ahead of prod (orchestration-prod.yml). Context: ztmf-misc#345.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# Serialize runs on the same ref.
concurrency:
  group: orchestration-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Analysis
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/analysis.yml
    secrets: inherit

  ui:
    name: ui
    if: github.event.pull_request.draft == false
    needs:
      - analysis
    uses: ./.github/workflows/ui.yml
    with:
      environment: dev
      deploy: false
    secrets: inherit

  # The one check the main ruleset requires. Skipped reusable-workflow jobs
  # report under the caller's name and run ones under nested names, so no
  # single nested check is always present to require.
  result:
    name: PR checks passed
    if: always()
    needs: [analysis, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::A PR check failed or was cancelled."
            exit 1
          fi
          echo "All PR checks passed or were skipped."
