name: Orchestration PROD

# Every merge to main deploys dev first, then prod only if dev succeeded, so a
# bad bundle stops at dev. Dev deploys only from here (and manual-deploy-dev);
# PRs deploy to per-PR environments. Context: ztmf-misc#345.

on:
  pull_request:
    branches:
      - main
    types:
      - closed

# One prod run at a time across merges; a later merge already includes earlier
# ones, so the single pending slot is enough. Keyed on merged so an unmerged
# close lands in its own bucket and cannot evict a pending prod deploy.
concurrency:
  group: orchestration-prod-${{ github.event.pull_request.merged }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Analysis
    if: ${{ github.event.pull_request.merged }}
    uses: ./.github/workflows/analysis.yml
    secrets: inherit

  ui-dev:
    # One dev sync at a time, shared with manual-deploy-dev; queue, do not cancel.
    concurrency:
      group: deploy-dev
      queue: max
      cancel-in-progress: false
    if: ${{ github.event.pull_request.merged }}
    name: ui dev
    needs:
      - analysis
    uses: ./.github/workflows/ui.yml
    with:
      environment: dev
    secrets: inherit

  ui:
    # One prod sync at a time; queue, do not cancel.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    if: ${{ github.event.pull_request.merged }}
    name: ui prod
    needs:
      - ui-dev
    uses: ./.github/workflows/ui.yml
    with:
      environment: prod
    secrets: inherit
